[workspace]
members = ["aegis-wire", "aegis-sensor-linux", "aegis-sensor-macos", "aegis-sensor-macos/native"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
aegis-wire = { path = "aegis-wire" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"

[workspace.lints.rust]
unsafe_code = "forbid"
