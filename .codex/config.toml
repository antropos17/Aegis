sandbox_mode = "workspace-write"
approval_policy = "on-request"

web_search = "live"

[sandbox_workspace_write]
network_access = true

[features.network_proxy]
enabled = true
domains = { "github.com" = "allow", "api.github.com" = "allow", "crates.io" = "allow", "index.crates.io" = "allow", "static.crates.io" = "allow", "registry.npmjs.org" = "allow" }

[agents]
max_concurrent_threads_per_session = 6

# Reuse the existing user-level server registrations in this checkout.
[mcp_servers.aegis_serena]
enabled = true

[mcp_servers.aegis_context7]
enabled = true
