name = "integration-engineer"
description = "Implements AEGIS main-process work in src/main and src/shared: event pipeline, sensor host, alert explanation, Cedar policies, guard-mode hooks, packaging and Observatory wiring. Use when the orchestrator delegates W1, W4, W5, W6, W9 wiring or W10 blocks from docs/roadmap/completion-plan.md."
