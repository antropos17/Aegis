title: Credential file read
name: cred_file_read
logsource:
  product: aegis
  category: file
detection:
  selection:
    event.action:
      - file-accessed
      - file-handle-held
    file.path|re|i: '[\\/](?:[^\\/]*[._\d-])?(?:passwords?|credentials?)[^\\/]*$'
  condition: selection
---
title: Credential file read followed by outbound connection
id: SEQ001
level: high
correlation:
  type: temporal_ordered
  rules:
    - cred_file_read
    - missing_step
  group-by:
    - process.entity_id
  timespan: 5m
