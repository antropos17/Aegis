name: Translate Observatory catalogs

# Finds messages one Observatory catalog has and the others lack (plus literal
# $t('…') text missing from all of them) and opens one pull request against
# master with the translations. Nothing is written to master directly.
on:
  push:
    branches: [master]
    paths: ['frontend/observatory/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: translate-observatory-${{ github.ref }}
  cancel-in-progress: false

jobs:
  translate:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check translation service configuration
        id: service
        env:
          LOCALIZE_DEV_API_KEY: ${{ secrets.LOCALIZE_DEV_API_KEY }}
        run: |
          if [ -n "$LOCALIZE_DEV_API_KEY" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Translations are inactive until LOCALIZE_DEV_API_KEY is configured.'
          fi
      - name: Preserve an existing translation proposal
        id: proposal
        if: steps.service.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const url = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/git/ref/heads/localize-dev/master`;
          (async () => {
            const response = await fetch(url, {
              headers: { authorization: `Bearer ${process.env.GH_TOKEN}`, accept: 'application/vnd.github+json' },
              signal: AbortSignal.timeout(15000),
            });
            if (response.status !== 200 && response.status !== 404) {
              throw new Error(`Translation branch check failed: HTTP ${response.status}`);
            }
            const enabled = response.status === 404;
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `enabled=${enabled}\n`);
            if (!enabled) {
              console.log('::notice::Review and merge or remove the existing localize-dev/master proposal before generating another.');
            }
          })().catch((error) => { console.error(error.message); process.exitCode = 1; });
          NODE
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: steps.service.outputs.enabled == 'true' && steps.proposal.outputs.enabled == 'true'
        with:
          persist-credentials: false
      - uses: ufortstephen/autolocalize-action@32e4e25158f432b76a2de9581f97f5bfa77e304d # localize-dev 0.35.0
        if: steps.service.outputs.enabled == 'true' && steps.proposal.outputs.enabled == 'true'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          api_key: ${{ secrets.LOCALIZE_DEV_API_KEY }}
          mode: translate
          working_directory: frontend/observatory
          base_branch: master
          # pt-BR also reads the legacy renderer catalog, so it stays maintained by hand.
          # Configure the workspace with these six targets too: dashboard choices take precedence in the action.
          target_locales: es,fr,de,ja,zh-CN,ru
          timeout_minutes: '10'
