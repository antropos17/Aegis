    <text x="56" y="157" font-size="49" font-weight="650" letter-spacing="-1" fill="#f3f6f7">Your agents have access.</text>
    <text x="56" y="219" font-size="49" font-weight="650" letter-spacing="-1" fill="#22d3ee">You deserve visibility.</text>
    <text x="59" y="265" font-size="23" fill="#b5c3cc">A local security dashboard for AI coding agents.</text>
