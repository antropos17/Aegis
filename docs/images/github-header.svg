    <linearGradient id="line"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#b6d9e7" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="1280" height="400" rx="18" fill="url(#surface)"/>
  <rect width="1280" height="400" rx="18" fill="url(#grid)"/>
  <rect x=".5" y=".5" width="1279" height="399" rx="18" fill="none" stroke="#293841"/>
  <g font-family="Segoe UI, Arial, sans-serif">
