<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title description">
  <title id="title">AEGIS — See what your AI agents are doing</title>
  <desc id="description">Your agents have access. You deserve visibility. A local security dashboard for AI coding agents. Observe activity, review projects and investigate evidence.</desc>
